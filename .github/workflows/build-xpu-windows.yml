# Build the AIMDO XPU native backend (aimdo_xpu.dll) on Windows and package it
# into the clean comfy_aimdo wheel.
#
# Why this shape:
#   * The native XPU implementation (src-xpu/) lives in the community fork
#     xiangyuT/comfy-aimdo-xpu, kept mutually compatible with its own src/ +
#     src-win/. Upstream comfy-aimdo has no src-xpu/ at all. We keep a
#     patched copy of src-xpu/ in THIS repo and overlay it onto the community
#     tree after checkout (see "Overlay patched src-xpu/" step) so the build
#     compiles OUR source (M2 single-ledger / Book A fix), then we package
#     ONLY the resulting DLL into THIS repo's clean Python integration
#     (comfy_aimdo/ with our xpu.py + control.py/torch.py edits).
#   * The DLL is torch-version agnostic at compile time (it talks to Level Zero
#     and the Unified Runtime at runtime). The torch 2.14.0+xpu / bmg pin is a
#     RUNTIME contract recorded in provider.json (M4), not baked into the DLL.
#
# oneAPI install note: we use Intel's OWN offline-installer recipe (component
# intel.oneapi.win.cpp-dpcpp-common, see oneapi-src/oneapi-ci) instead of a
# third-party Marketplace action, so the build does not depend on an externally
# hosted action ref that can disappear.

name: Build AIMDO XPU native (Windows, oneAPI/DPC++)

on:
  workflow_dispatch:
    inputs:
      xpu_target:
        description: >-
          XPU silicon target for artifact labeling only (bmg / ptl-h / dg2).
          Does NOT change the DLL build.
        required: false
        default: "bmg"
      torch_xpu_version:
        description: >-
          Target torch+XPU runtime version, recorded in the artifact metadata.
          The hard pin lands in provider.json at M4.
        required: false
        default: "2.14.0+xpu"
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

env:
  COMMUNITY_FORK_REPO: xiangyuT/comfy-aimdo-xpu
  # Pinned, mutually-compatible native tree (src/ + src-win/ + src-xpu/).
  COMMUNITY_FORK_SHA: cc3729fc59eeab77bd4c8b28b80e49c9faa855d4
  # Intel oneAPI Toolkit offline installer (DPC++/C++ compiler).
  #
  # WHY 2026.x AND NOT 2025.x: aimdo_xpu.dll links against the Intel SYCL
  # runtime, whose DLL name is versioned per oneAPI release (sycl7=2024.x,
  # sycl8=2025.x, sycl9=2026.x). src-xpu/dispatch.cpp receives torch's
  # `sycl::queue*` directly, so the DLL's SYCL ABI MUST match the runtime that
  # torch.xpu itself was built against. A 2025.3 build imports sycl8.dll, which
  # does not exist next to torch 2.14.0+xpu (Arc B580 / 2026 Intel drivers
  # bundle sycl9.dll) -- the DLL then fails to load with an opaque ctypes
  # "Could not find module ... (or one of its dependencies)".
  # The "Verify SYCL runtime ABI" step below turns that class of mistake into a
  # loud CI failure instead of a broken artifact.
  ONEAPI_INSTALLER_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/bae85ab1-cfcd-4251-8d42-a0c27949ea33/intel-oneapi-toolkit-2026.0.0.193_offline.exe
  ONEAPI_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
  # SYCL runtime the built DLL MUST import (keep in sync with ONEAPI_INSTALLER_URL).
  EXPECTED_SYCL_DLL: sycl9.dll
  LEVEL_ZERO_TAG: v1.34.0

jobs:
  build-xpu-windows:
    name: aimdo_xpu.dll + wheel (win2022 / oneAPI DPC++)
    runs-on: windows-2022
    steps:
      - name: Checkout clean Python integration (this repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          path: aimdo

      - name: Fetch upstream tags for setuptools-scm version
        shell: bash
        working-directory: aimdo
        run: |
          git fetch --tags --force https://github.com/Comfy-Org/comfy-aimdo.git || true
          git fetch --tags --force origin || true
          echo "Resolved version:"; git describe --tags || echo "(no tag; setuptools-scm falls back to 0.0+<sha>)"

      - name: Checkout community fork native tree (compatible src/ + src-win/ + src-xpu/)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.COMMUNITY_FORK_REPO }}
          ref: ${{ env.COMMUNITY_FORK_SHA }}
          fetch-depth: 1
          path: native

      - name: Overlay patched src-xpu/ from this repo (M2 single-ledger / Book A)
        shell: bash
        run: |
          # Our fork owns the XPU native source. The community checkout above is
          # only a known-good build environment + scripts; we must compile OUR
          # src-xpu/ (dispatch.cpp carries the M2 Book A fix), not the community's
          # unmodified tree -- otherwise the Book A exports never reach the DLL.
          cp -r aimdo/src-xpu/. native/src-xpu/
          echo "Overlaid src-xpu into native/src-xpu/:"; ls -1 native/src-xpu/

      - name: Install Intel oneAPI DPC++/C++ Compiler (offline installer)
        shell: cmd
        run: |
          curl.exe --output %RUNNER_TEMP%\webimage.exe --url %ONEAPI_INSTALLER_URL% --retry 5 --retry-delay 5
          REM Preferred path (documented for the 2026 toolkit package): direct silent install.
          %RUNNER_TEMP%\webimage.exe -s -a --silent --eula accept --components=%ONEAPI_COMPONENTS% -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log=native\build\oneapi_install.log
          if errorlevel 1 (
            echo direct silent install failed; falling back to extract + bootstrapper 1>&2
            %RUNNER_TEMP%\webimage.exe -s -x -f native\build\oneapi_extracted --log native\build\extract.log
            native\build\oneapi_extracted\bootstrapper.exe -s --action install --components=%ONEAPI_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=native\build
          )
          if errorlevel 1 exit /b 1
          del /q %RUNNER_TEMP%\webimage.exe
          if not exist "C:\Program Files (x86)\Intel\oneAPI\compiler" (
            echo oneAPI compiler dir missing after install 1>&2
            dir /s /b "C:\Program Files (x86)\Intel\oneAPI" 2>&1 | findstr /i "compiler" | more
            exit /b 1
          )
          echo oneAPI installed at C:\Program Files (x86)\Intel\oneAPI

      - name: Provision Level Zero headers
        shell: bash
        run: |
          git clone --depth 1 --branch "$LEVEL_ZERO_TAG" \
            https://github.com/oneapi-src/level-zero.git native/build/level-zero-src
          test -f native/build/level-zero-src/include/ze_api.h \
            && echo "ze_api.h present" \
            || { echo "ze_api.h MISSING"; exit 1; }

      - name: Provision Microsoft Detours
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/Detours.git native/build/detours-src
          test -f native/build/detours-src/src/detours.cpp \
            && echo "Detours source present" \
            || { echo "Detours source MISSING"; exit 1; }

      - name: Build Detours
        shell: cmd
        run: cmd /d /c native\scripts\build-windows-detours.cmd

      - name: Build aimdo_xpu.dll
        shell: cmd
        run: cmd /d /c native\scripts\build-windows-xpu.cmd

      - name: Verify DLL produced
        shell: bash
        run: |
          ls -l native/comfy_aimdo/aimdo_xpu.dll
          echo "DLL size bytes: $(stat -c%s native/comfy_aimdo/aimdo_xpu.dll 2>/dev/null || wc -c < native/comfy_aimdo/aimdo_xpu.dll)"

      - name: Verify SYCL runtime ABI matches torch.xpu (import-table gate)
        shell: bash
        env:
          EXPECTED: ${{ env.EXPECTED_SYCL_DLL }}
        run: |
          # aimdo_xpu.dll must import the SAME versioned SYCL runtime that the
          # target torch.*+xpu build uses, because dispatch.cpp exchanges
          # sycl::queue objects with it. Building against a different oneAPI major
          # yields a DLL that either fails to load on the user's machine or
          # marshals sycl::queue across incompatible ABIs. Fail loudly here.
          python - <<'PY'
          import os, struct, sys
          p = "native/comfy_aimdo/aimdo_xpu.dll"
          want = os.environ["EXPECTED"].lower()
          d = open(p, "rb").read()
          e = struct.unpack_from("<I", d, 0x3C)[0]
          if d[e:e+4] != b"PE\x00\x00":
              sys.exit("not a PE: %s" % p)
          opt = e + 4 + 20
          magic = struct.unpack_from("<H", d, opt)[0]
          imp_rva = struct.unpack_from("<I", d, opt + (120 if magic == 0x20B else 104))[0]
          opt_size = struct.unpack_from("<H", d, e + 4 + 16)[0]
          sec_off = e + 4 + 20 + opt_size
          nsec = struct.unpack_from("<H", d, e + 4 + 2)[0]
          def r2(rva):
              for i in range(nsec):
                  so = sec_off + i * 40
                  vs = struct.unpack_from("<I", d, so + 8)[0]
                  va = struct.unpack_from("<I", d, so + 12)[0]
                  rp = struct.unpack_from("<I", d, so + 20)[0]
                  if va <= rva < va + vs:
                      return rp + (rva - va)
              return rva
          tbl = r2(imp_rva); dlls = []; i = 0
          while struct.unpack_from("<I", d, tbl + i * 20)[0] != 0:
              nm = struct.unpack_from("<I", d, tbl + i * 20 + 12)[0]; no = r2(nm)
              dlls.append(d[no:d.index(b"\x00", no)].decode("utf-8", "replace")); i += 1
          print("DLL imports (%d): %s" % (len(dlls), ", ".join(dlls)))
          sycl = sorted(x for x in dlls if x.lower().startswith("sycl"))
          print("SYCL runtime imports:", sycl or "(none)")
          low = [x.lower() for x in dlls]
          if want not in low:
              sys.exit("ABI GATE FAILED: expected import %s (oneAPI 2026.x) so the DLL "
                       "matches torch 2.14.0+xpu; got %s. Bump ONEAPI_INSTALLER_URL to a "
                       "toolkit whose DPC++ runtime is %s." % (os.environ["EXPECTED"], sycl or "none", os.environ["EXPECTED"]))
          stale = [x for x in low if x.startswith("sycl") and x != want]
          if stale:
              sys.exit("ABI GATE FAILED: DLL also imports stale SYCL runtime(s) %s" % stale)
          print("ABI GATE PASSED: imports %s as required." % os.environ["EXPECTED"])
          PY

      - name: Best-effort no-GPU hook unit test
        # Validates the UR/USM interception logic without a device. Non-fatal:
        # surfaces signal but never blocks the artifact.
        shell: cmd
        continue-on-error: true
        run: cmd /d /c native\scripts\test-windows-xpu-hook.cmd

      - name: Stage DLL into clean Python package
        shell: bash
        run: |
          mkdir -p aimdo/comfy_aimdo
          cp native/comfy_aimdo/aimdo_xpu.dll aimdo/comfy_aimdo/aimdo_xpu.dll
          ls -l aimdo/comfy_aimdo/aimdo_xpu.dll

      - name: Build wheel (setuptools-scm derives version from upstream tags)
        shell: bash
        working-directory: aimdo
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse
          ls -l wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comfy-aimdo-xpu-wheel
          path: aimdo/wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload standalone DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aimdo_xpu.dll
          path: native/comfy_aimdo/aimdo_xpu.dll
          if-no-files-found: error
