[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-aimdo"
dynamic = ["version"]
description = "AI Model Dynamic Offloader for ComfyUI"
readme= "README.md"
requires-python = ">=3.9"
authors = [{name = "rattus"}]

[project.urls]
Repository = "https://github.com/Comfy-Org/comfy-aimdo"

[tool.setuptools]
packages = ["comfy_aimdo"]

[tool.setuptools.package-data]
"comfy_aimdo" = ["*.so", "*.dll", "*.json"]

[tool.setuptools_scm]
version_file = "comfy_aimdo/_version.py"
local_scheme = "no-local-version"
# The repo carries stray archive/* tags (left over from archived branches) that
# setuptools-scm cannot parse as versions, which breaks every feature-branch
# wheel build with "Can't parse version from tag". On a release tag a real
# version is still derived; on branches with only archive/* tags reachable this
# fallback keeps the build green instead of failing the wheel. Works for all
# build paths (native Windows, cibuildwheel Windows, cibuildwheel Linux/docker)
# because setuptools-scm reads it from pyproject.toml directly.
fallback_version = "0.0.0.dev0"
