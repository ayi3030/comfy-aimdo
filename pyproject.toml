[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-aimdo"
dynamic = ["version"]
description = "AI Model Dynamic Offloader for ComfyUI"
readme= "README.md"
requires-python = ">=3.9"
authors = [{name = "rattus"}]

[project.urls]
Repository = "https://github.com/Comfy-Org/comfy-aimdo"

[tool.setuptools]
packages = ["comfy_aimdo"]

[tool.setuptools.package-data]
"comfy_aimdo" = ["*.so", "*.dll", "*.json"]

[tool.setuptools_scm]
version_file = "comfy_aimdo/_version.py"
local_scheme = "no-local-version"
# The repo carries stray archive/* tags (left over from archived branches) that
# setuptools-scm cannot parse as versions, which breaks every feature-branch
# wheel build with "Can't parse version from tag". With tag.strict = true,
# setuptools-scm walks back to the nearest PARSEABLE tag (e.g. v0.5.5) and
# derives a real dev version instead of erroring on the archive/* tag. This is
# read from pyproject.toml directly, so it works for every build path (native
# Windows, cibuildwheel Windows, cibuildwheel Linux/docker) with no env-var
# propagation into cibuildwheel's Linux container. fallback_version is a safety
# net for branches with no parseable tag reachable.
tag.strict = true
fallback_version = "0.0.0.dev0"
